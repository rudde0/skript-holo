import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'java'
}

group = 'me.blueyescat.skriptholo'
version = '2.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// Bytecode 21 so the same jar loads on 1.21.x (Java 21) and 26.x (Java 25) servers.
	options.release = 21
	options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.papermc.io/repository/maven-public/' }
	maven { url = 'https://repo.skriptlang.org/releases' }
	maven { url = 'https://jitpack.io' }
	maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
	maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
}

dependencies {
	compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
	compileOnly 'com.github.SkriptLang:Skript:2.15.2'
	compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'
}

// No runtime dependencies are bundled: the plugin jar only contains its own classes.
jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
	filter(ReplaceTokens, tokens: [version: version])
}
